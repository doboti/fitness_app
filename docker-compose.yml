# Önállóan:            docker compose up -d --build
# Meglévő stackbe:     másold be a workout-api blokkot, és a "context"-et állítsd erre a repóra (pl. ./workout-app).
services:
  workout-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workout-api
    restart: unless-stopped
    environment:
      - TZ=Europe/Budapest
      # Havi Gemini edzői kör (opcionális; nélküle a kézi mód működik):
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - GEMINI_MODEL=gemini-3.8-flash
    volumes:
      - ./workout-data:/data
    # Csak a hoston érhető el; kifelé a Tailscale (tailscale serve) adja a HTTPS-t.
    ports:
      - "127.0.0.1:8420:8420"
    mem_limit: 256m
    cpus: 0.5
