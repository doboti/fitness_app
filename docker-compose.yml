# PROD: a Deploy PROD workflow (scripts/deploy.sh) ezzel indítja, projekt-névvel: docker compose -p workout …
# Kézzel, a repó gyökeréből:  WORKOUT_DATA_DIR=/srv/workout/data docker compose -p workout up -d --build
# Titkok (pl. GEMINI_API_KEY=…, GEMINI_MODEL=…) a repó gyökerében lévő .env fájlba – ez gitignore-ban van.
services:
  workout-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: workout-api:latest
    container_name: workout-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Europe/Budapest
    volumes:
      - ${WORKOUT_DATA_DIR:-./workout-data}:/data
    # Csak a hoston érhető el; kifelé a Tailscale (tailscale serve) adja a HTTPS-t.
    ports:
      - "127.0.0.1:8420:8420"
    mem_limit: 256m
    cpus: 0.5
